# Keep the whale record growing while nobody is looking.
#
# Everything the accumulation, consensus and stealth layers compute is
# arithmetic over a history, and until this workflow existed the app only
# collected while somebody had the panel open. A tab open for five minutes a day
# gave five minutes of tape a day — which is why the store held twelve transfers
# and every consensus reading came back Neutral. Not because the whales were
# balanced, but because almost nothing had been watched.
#
# Here rather than on Vercel: a Hobby deployment allows two cron jobs and will
# run them **once a day**, which is not a record, it is a daily snapshot.
# Actions minutes are unlimited on a public repository, and this repository is
# public, so the schedule is free and can run every ten minutes.
#
# The job does nothing but ask the deployment to poll. All the work, the keys
# and the database stay on the server; this is a doorbell.

name: Collect whale transfers

on:
  schedule:
    # Every ten minutes. GitHub queues scheduled runs and can delay them under
    # load, so treat this as "roughly every ten minutes" — which is fine, since
    # each poll reads a window rather than a point and overlapping is harmless.
    - cron: '*/10 * * * *'
  # So it can be run by hand after a deploy without waiting for the schedule.
  workflow_dispatch:

# Two runs polling at once would only duplicate work the store then discards.
concurrency:
  group: collect-whales
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # The spot step reads about one pool every ten seconds — GeckoTerminal's
    # real allowance, measured — and stops at eighteen minutes; the poll and the
    # four options reads take about two more. Free on a public repository.
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Ask the deployment to poll the chains
        env:
          BASE: ${{ vars.RISKBOOK_URL || 'https://riskbook.vercel.app' }}
          KEY: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KEY" ]; then
            echo "CRON_SECRET is not set on this repository — nothing to do."
            echo "Add it under Settings -> Secrets and variables -> Actions,"
            echo "with the same value as CRON_SECRET in the Vercel environment."
            exit 0
          fi

          # --max-time is generous: one sweep of five chains takes about twenty
          # seconds and the endpoint is allowed sixty.
          code=$(curl -s -S --max-time 90 -o response.json -w '%{http_code}' \
            "$BASE/api/whales?resource=poll&key=$KEY")

          echo "HTTP $code"
          cat response.json
          echo

          # The annotation carries the server's own words. It used to say only
          # the status code, and the reply explaining it sat in a log that needs
          # a sign-in to read — so four days of "504" told nobody anything.
          # Annotations are public on a public repository; the reason belongs
          # there.
          said=$(head -c 400 response.json | tr -d '\r\n')
          # Anything but a 200 means nothing was collected — the server was
          # down, timed out, or could not reach the database — so the run fails
          # in red, which is what makes GitHub email the owner. It used to be a
          # warning on a green run, and that is how four days of 504s went
          # unnoticed. A job failing inside a 200 is a bad afternoon for one
          # source, and stays a warning.
          if [ "$code" != "200" ]; then
            echo "::error::the collector answered $code: ${said:-no body}"
            exit 1
          # Any job's "failed" that is a non-empty string or a non-empty list.
          elif grep -Eq '"failed":("[^"]|\[")' response.json; then
            echo "::warning::the collector answered 200 but a job failed: $said"
          fi

      # Spot trades are read here, on the runner, not by the poll above.
      # GeckoTerminal limits by IP and refused the deployment's shared
      # addresses: 13 of 17 calls in one run came back 429. This runner has
      # an address of its own and no sixty-second ceiling, so it reads every
      # known pool each run and posts the trades back. See scripts/collect-spot.mjs.
      - name: Read spot whale trades and post them
        if: always()
        env:
          BASE: ${{ vars.RISKBOOK_URL || 'https://riskbook.vercel.app' }}
          KEY: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KEY" ]; then exit 0; fi
          node scripts/collect-spot.mjs "$BASE" "$KEY"

      # Options exposure for the DEX & GEX history chart, which draws one point
      # a day. A point only exists for a day on which the chain was read, and
      # that used to mean a day somebody opened the panel. Reading every market
      # here gives each day its reading whoever looked. One request per market,
      # each its own function call with its own sixty seconds — the S&P chain
      # alone is thirteen megabytes.
      - name: Record options exposure for the history
        if: always()
        env:
          BASE: ${{ vars.RISKBOOK_URL || 'https://riskbook.vercel.app' }}
          KEY: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KEY" ]; then exit 0; fi
          for market in BTC ETH SPX NDX; do
            code=$(curl -s -S --max-time 90 -o exposure.json -w '%{http_code}' \
              "$BASE/api/options?market=$market&key=$KEY")
            echo "$market: HTTP $code"
            # One market's feed being down is that market's bad afternoon, not
            # an outage: a warning, and the others still record.
            if [ "$code" != "200" ]; then
              echo "::warning::options $market answered $code: $(head -c 200 exposure.json | tr -d '\r\n')"
            fi
          done
